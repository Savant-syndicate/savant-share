        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, ck, b64(D.ct));
      })
      .catch(function () { return tryDoor(base, i + 1); });
  }

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = p.value;
    if (!pass) return;
    b.disabled = true;
    say("Decrypting\u2026", false);

    crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) { return tryDoor(base, 0); })
      .then(function (buf) {
        var doc = new TextDecoder("utf-8").decode(buf);
        document.open("text/html");
        document.write(doc);
        document.close();
      })
      .catch(function () {
        // GCM authentication failed on every door. The only cause a reader can
        // act on is a wrong passcode; a tampered file fails identically and by design.
        b.disabled = false;
        p.value = "";
        p.focus();
        say("That passcode did not open this document. Check it and try again.", true);
      });
  });
  p.focus();
})();
</script>
