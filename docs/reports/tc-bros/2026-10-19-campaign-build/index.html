<script>
(function () {
  var D = JSON.parse(document.getElementById("payload").textContent);
  var f = document.getElementById("f"), p = document.getElementById("p"),
      b = document.getElementById("b"), m = document.getElementById("m");

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function say(text, isErr) { m.textContent = text; m.className = isErr ? "msg err" : "msg"; }

  if (!(window.crypto && window.crypto.subtle)) {
    say("This browser cannot decrypt the document. Open it over https, in a current browser.", true);
    b.disabled = true;
    return;
  }

  // One door at a time: derive the door's key from the passcode, unwrap the
  // content key, open the page. A passcode that opens no door fails on the last
  // door's GCM tag, exactly as a single-door page would.
  function tryDoor(base, i) {
    if (i >= D.doors.length) return Promise.reject(new Error("no door"));
    var door = D.doors[i];
    return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(door.salt), iterations: D.iterations, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      )
      .then(function (kek) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(door.iv) }, kek, b64(door.wk));
      })
      .then(function (raw) {
        return crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
      })
      .then(function (ck) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, ck, b64(D.ct));
      })
      .catch(function () { return tryDoor(base, i + 1); });
  }

  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = p.value;
    if (!pass) return;
    b.disabled = true;
    say("Decrypting\u2026", false);

    crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) { return tryDoor(base, 0); })
      .then(function (buf) {
        var doc = new TextDecoder("utf-8").decode(buf);
        document.open("text/html");
        document.write(doc);
        document.close();
      })
      .catch(function () {
        // GCM authentication failed on every door. The only cause a reader can
        // act on is a wrong passcode; a tampered file fails identically and by design.
        b.disabled = false;
        p.value = "";
        p.focus();
        say("That passcode did not open this document. Check it and try again.", true);
      });
  });
  p.focus();
})();
